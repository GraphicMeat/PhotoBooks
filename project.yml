# PhotoBooks Xcode project definition (XcodeGen).
#
# The .xcodeproj is GENERATED and git-ignored — after cloning (or after
# editing this file) run:
#
#   brew install xcodegen   # once
#   xcodegen generate
#
# Decision: ONE multiplatform app target with iOS + macOS destinations
# (XcodeGen `supportedDestinations`) instead of two per-platform targets.
# The app is a single SwiftUI codebase with #if os(...) branches; two
# targets would duplicate every build setting, plist entry, and package
# dependency for zero benefit. Platform-specific bits that genuinely differ
# are expressed with sdk-scoped settings (entitlements below).
name: PhotoBooks
options:
  bundleIdPrefix: com.graphicMeat
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  PhotoBookCore:
    path: Packages/PhotoBookCore
  PhotoBookImport:
    path: Packages/PhotoBookImport
  PhotoBookRender:
    path: Packages/PhotoBookRender
  EditCore:
    path: Packages/EditCore
  AppSupport:
    path: Packages/AppSupport
  ModelLayer:
    path: Packages/ModelLayer
  SetupFeature:
    path: Packages/SetupFeature
  ExportFeature:
    path: Packages/ExportFeature
  EditorFeature:
    path: Packages/EditorFeature
  DocumentUI:
    path: Packages/DocumentUI
  # Sparkle auto-updater — Developer ID (Direct) build only. Never a dependency
  # of the App Store target, so that build embeds no Sparkle framework.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.8.1"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.1.1"
    # CFBundleVersion (Sparkle's update-comparison identity) tracks the marketing
    # version so it increments every release. Frozen at "1" before, it made every
    # build look identical to Sparkle and broke auto-update.
    CURRENT_PROJECT_VERSION: $(MARKETING_VERSION)

# Both app flavors share sources, packages, bundle identity, and Info.plist
# metadata via this template. They differ only on the DISTRIBUTION axis:
#   PhotoBooks         — App Store, iOS + macOS, no Sparkle.
#   PhotoBooks-Direct  — Developer ID DMG, macOS only, Sparkle auto-update.
# (The "one target" convention was about iOS/macOS DESTINATIONS; distribution
# flavor is a separate axis, so a second target is justified.)
targetTemplates:
  AppBase:
    type: application
    dependencies:
      - package: DocumentUI
      - package: ExportFeature
      - package: ModelLayer
      # The app root injects \.supportOffer (App Store tip jar vs Direct donate
      # link), so it imports AppSupport directly rather than transitively.
      - package: AppSupport
    # Fail the build when project.yml has been edited but `xcodegen generate`
    # hasn't been re-run — otherwise Xcode silently builds the stale project
    # (this shipped an App Store binary missing UISupportedInterfaceOrientations
    # and ASC rejected it: "No orientations were specified").
    preBuildScripts:
      - name: Check generated project is up to date
        basedOnDependencyAnalysis: false
        # The scheme pre-action (below, `regenerate-project`) runs xcodegen before
        # every build. If it rewrote the project, Xcode is still building from the
        # model it loaded before that, so fail loudly and ask for a second Run.
        # The mtime check is the fallback for builds that skip scheme pre-actions
        # (`xcodebuild -target`, or the pre-action failing to find xcodegen).
        script: |
          if [ -e "$SRCROOT/.xcodegen-regenerated" ]; then
            rm -f "$SRCROOT/.xcodegen-regenerated"
            echo "error: Xcode project was just regenerated from project.yml. Press Run again."
            exit 1
          fi
          if [ "$SRCROOT/project.yml" -nt "$PROJECT_FILE_PATH/project.pbxproj" ]; then
            echo "error: project.yml is newer than the generated Xcode project. Run 'xcodegen generate', then reopen the project in Xcode."
            exit 1
          fi
    settings:
      base:
        # Same bundle id for both flavors: a Developer ID install and its
        # Sparkle updates share update identity + keychain continuity. Only
        # one flavor is ever submitted to the App Store.
        PRODUCT_BUNDLE_IDENTIFIER: com.graphicMeat.PhotoBooks
        PRODUCT_NAME: PhotoBooks
        ASSETCATALOG_COMPILER_APPICON_NAME: Icon
        SUPPORTS_MACCATALYST: false
    info:
      properties:
        CFBundleName: PhotoBooks
        CFBundleDisplayName: PhotoBooks
        # Wire the About-panel version to MARKETING_VERSION (else xcodegen
        # defaults it to a stale literal "1.0").
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Sparkle compares CFBundleVersion (not the short string) to the appcast's
        # sparkle:version. Pin it to the marketing version so the two always match
        # and every release is a distinct, monotonically newer build.
        CFBundleVersion: $(MARKETING_VERSION)
        # App Store metadata (harmless in the Direct build too).
        LSApplicationCategoryType: public.app-category.photography
        NSHumanReadableCopyright: © 2026 graphicmeat.com. All rights reserved.
        # No non-exempt encryption — suppresses the export-compliance prompt
        # on every App Store Connect upload.
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: >-
          PhotoBooks lays out books from photos you choose in your library.
          Originals stay in Photos; the app only reads them to arrange pages
          and export your book.
        # Document-based app: the .photobookGraphicMeat package type, exported by us.
        CFBundleDocumentTypes:
          - CFBundleTypeName: PhotoBooks Book
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes:
              - com.graphicMeat.PhotoBooks.book
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.graphicMeat.PhotoBooks.book
            UTTypeDescription: PhotoBooks Book
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - photobookGraphicMeat
        # iOS document-app affordances (ignored on macOS).
        UILaunchScreen: {}
        # All four orientations = iPad multitasking support. App Store Connect
        # rejects an iPad-capable bundle that declares none.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true

targets:
  PhotoBooks:
    templates: [AppBase]
    supportedDestinations: [iOS, macOS]
    sources:
      # Exclude the Direct flavor's Info plist: xcodegen only auto-excludes this
      # target's own info.path, so the sibling plist would otherwise be copied
      # into Contents/Resources verbatim (unexpanded $(PRODUCT_BUNDLE_IDENTIFIER))
      # and App Store Connect rejects it as a broken nested bundle (90280/90261/90277).
      - path: App
        excludes:
          - Info-Direct.plist
          # Xcode's StoreKit test configuration — referenced by the scheme, not
          # a build input. Left in sources it would be copied into the bundle.
          - PhotoBooks.storekit
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          # Ad-hoc ("Sign to Run Locally") signing for local macOS runs: no
          # team required; sandbox + entitlements still apply. iOS builds in
          # this plan use CODE_SIGNING_ALLOWED=NO on the command line.
          "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
          # Debug adds a temporary sandbox read exception for UITest fixture
          # folders — see App/PhotoBooks-Debug.entitlements.
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/PhotoBooks-Debug.entitlements
        Release:
          # App Store distribution: Xcode-managed automatic signing against
          # the Apple Distribution cert + hardened runtime (macOS).
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/PhotoBooks.entitlements
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: YXDJG24NWG
          # Automatic signing picks the identity itself: the archive is signed
          # with Apple Development, then re-signed with the Apple Distribution
          # cert at export time (exportOptions method: app-store). Pinning
          # CODE_SIGN_IDENTITY here conflicts with automatic signing, so it is
          # intentionally left unset. Hardened runtime is macOS-only; iOS is
          # inherently sandboxed and uses no entitlements file (PhotoKit +
          # document picker need none).
          "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": true
    info:
      path: App/Info.plist

  # Developer ID / notarized DMG flavor with the Sparkle auto-updater.
  PhotoBooks-Direct:
    templates: [AppBase]
    platform: macOS
    # Excludes Icon.icon: the Icon Composer (Liquid Glass) icon crashes actool's
    # AssetCatalogAgent on headless CI runners. This build uses the plain PNG
    # AppIconDirect appiconset instead (below); the App Store target keeps the
    # Liquid Glass icon.
    sources:
      - path: App
        excludes:
          - Icon.icon
          # Sibling App Store Info plist — same stray-resource hazard as above.
          - Info.plist
          - PhotoBooks.storekit
    dependencies:
      - package: Sparkle
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDirect
      configs:
        Debug:
          # SPARKLE gates the updater code; DEBUG kept for normal debug builds.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG SPARKLE
          "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/PhotoBooks-DirectID.entitlements
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: SPARKLE
          # Developer ID: manual signing, no provisioning profile, hardened
          # runtime. Sandbox kept (parity with App Store); DirectID entitlements
          # add Sparkle's XPC mach-lookup exceptions.
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/PhotoBooks-DirectID.entitlements
          CODE_SIGN_STYLE: Manual
          "CODE_SIGN_IDENTITY[sdk=macosx*]": Developer ID Application
          DEVELOPMENT_TEAM: YXDJG24NWG
          PROVISIONING_PROFILE_SPECIFIER: ""
          "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": true
    info:
      path: App/Info-Direct.plist
      properties:
        # Sparkle: EdDSA public key (private key stays out of git), the appcast
        # feed on GitHub Releases, and automatic update checks (first-launch
        # consent shown by Sparkle).
        SUPublicEDKey: Bm5DCgHKFl7d7su7dKBSi+gxrlUwNxlAzI2UkeH5Sjw=
        SUFeedURL: https://github.com/GraphicMeat/PhotoBooks/releases/latest/download/appcast.xml
        SUEnableAutomaticChecks: true
        # Sandboxed apps must launch Sparkle's privileged installer through the
        # bundled Installer XPC service (uses the -spks/-spki mach-lookup
        # exceptions in the entitlements). Without this, install fails with
        # "An error occurred while launching the installer."
        SUEnableInstallerLauncherService: true

  PhotoBooksUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/PhotoBooksUITests
      # Bundled so TipJarSmokeTests can start an SKTestSession from it.
      - path: App/PhotoBooks.storekit
        buildPhase: resources
    dependencies:
      - target: PhotoBooks
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

schemes:
  PhotoBooks:
    build:
      preActions:
        # Keep the generated project in sync with project.yml on every Run.
        # Always regenerates (xcodegen's --use-cache misses scheme edits and
        # newly added source files) and diffs against a backup: unchanged
        # output is rolled back byte-for-byte with its old mtimes so Xcode
        # sees no churn; changed output leaves a marker the build-phase guard
        # turns into a "press Run again" error, since Xcode is still building
        # from the project model it loaded before the rewrite.
        - &regenerate-project
          name: regenerate-project
          settingsTarget: PhotoBooks
          script: |
            export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
            cd "$SRCROOT" || exit 1
            proj=PhotoBooks.xcodeproj
            bak=$(mktemp -d) || exit 1
            trap 'rm -rf "$bak"' EXIT
            cp -pR "$proj" "$bak/" 2>/dev/null
            xcodegen generate --quiet || exit 1
            if diff -rq -x xcuserdata "$bak/$proj" "$proj" >/dev/null 2>&1; then
              cp -pR "$bak/$proj/." "$proj/"
              rm -f .xcodegen-regenerated
              # git can bump project.yml's mtime without changing it; keep the
              # mtime fallback guard honest without a real regeneration.
              if [ project.yml -nt "$proj/project.pbxproj" ]; then touch "$proj/project.pbxproj"; fi
            else
              touch .xcodegen-regenerated
            fi
      targets:
        PhotoBooks: all
    run:
      config: Debug
      # Local tip-jar testing without App Store Connect products.
      storeKitConfiguration: App/PhotoBooks.storekit
    test:
      config: Debug
      targets:
        - PhotoBooksUITests
  # Developer ID / Sparkle build. Archived in Release for the notarized DMG.
  PhotoBooks (Direct):
    build:
      preActions:
        - *regenerate-project
      targets:
        PhotoBooks-Direct: all
    run:
      config: Debug
    archive:
      config: Release
